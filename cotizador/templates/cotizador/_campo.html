<div class="space-y-1">
  <label for="{{ campo.id_for_label }}" class="block text-sm font-medium">{{ campo.label }}</label>
  {{ campo }}
  {% if campo.help_text %}<p class="text-xs text-slate-500">{{ campo.help_text }}</p>{% endif %}
  {% for e in campo.errors %}<p class="text-sm text-red-600">{{ e }}</p>{% endfor %}
</div>
